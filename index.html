python:{label:'Python',approach:'Рөлдік ойын және кодты қадамдап орындау',task:'Кодты орындамай тұрып нәтижесін болжаңдар:\nfor i in range(1, 5):\n    print(i * 2)\n«Айнымалы», «цикл», «шығару» рөлдерін бөлісіңдер. i мәні мен экран нәтижесін трассалау кестесіне жазыңдар. Компьютерде іске қосып, болжаммен салыстырыңдар. range(1, 5) орнына range(1, 4) қойғанда не өзгеретінін түсіндіріңдер.',teacher:'range шекарасын, айнымалы мен цикл денесін көрсетеді; дайын жауап бермей, қадамды түсіндіруге бағыттайды.',student:'Кодты қадамдап модельдейді, трассалау кестесін толтырады, бағдарламаны орындайды және нәтижені түсіндіреді.',criteria:'Цикл орындалу ретін және range шекарасын түсіндіреді. Код нәтижесін дұрыс болжайды.',descriptors:'i айнымалысының мәндерін дұрыс анықтайды.\nЦикл денесін әр қадамда орындайды.\n2, 4, 6, 8 нәтижесін дұрыс жазады.\nШекараны өзгерткендегі айырмашылықты түсіндіреді.'},
web:{label:'Веб-технологиялар',approach:'Жобалық оқыту және жұптық шолу',task:'«Менің алғашқы веб-бетім»: index.html файлын құрыңдар. <!doctype html>, <html lang="kk">, <head>, <meta charset="UTF-8"> және <body> құрылымын жазыңдар. Бетте h1 тақырыбы, бір абзац және үш тармақты тізім болсын. <style> арқылы мәтін түсін, фонды және аралықты өзгертіңдер. Файлды браузерде ашып, жұбыңмен тегтер мен қазақ әріптерін тексеріңдер.',teacher:'HTML құрылымы мен CSS селекторын түсіндіреді; оқушылардың файлды сақтау және браузерде ашуын бақылайды.',student:'HTML бетін жасайды, CSS қосады, браузерде тексереді және жұбының жұмысына пікір береді.',criteria:'HTML құрылымы дұрыс. CSS стильдері көрінеді. Қазақ мәтіні оқылады.',descriptors:'Негізгі HTML тегтерін дұрыс орналастырады.\nТақырып, абзац және тізім жасайды.\nCSS арқылы кемінде үш қасиетті өзгертеді.\nБетті браузерде тексеріп, қатесін түзетеді.'},
sheet:{label:'Электрондық кестелер',approach:'Практикалық зерттеу және өзара тексеру',task:'A2:A5 ұяшықтарына төрт тауар атауын, B2:B5 ұяшықтарына бағасын, C2:C5 ұяшықтарына санын енгізіңдер. D2 ұяшығында =B2*C2 формуласын жазып, D5-ке дейін көшіріңдер. D6 ұяшығында =SUM(D2:D5) арқылы жалпы соманы есептеңдер. Баға өзгергенде нәтижені салыстырыңдар. Бағдарлама тілінде функция атауы өзгеше болса, функция шеберін пайдаланыңдар.',teacher:'Ұяшық сілтемесін, формула мен автотолтыруды көрсетеді; есептің мағынасын түсіндіруге бағыттайды.',student:'Кесте толтырады, формула енгізеді, көшіреді, қолмен есептеп тексереді.',criteria:'Ұяшық сілтемелері дұрыс. Формула автоматты есептейді. Қорытынды сома тексерілген.',descriptors:'Деректерді бағандарға дұрыс енгізеді.\nКөбейту формуласын қолданады.\nФормуланы салыстырмалы сілтемемен көшіреді.\nSUM нәтижесін қолмен тексереді.'},
safety:{label:'Цифрлық қауіпсіздік',approach:'Жағдаяттық талдау — «Цифрлық детектив»',task:'Жағдаят: «Сыйлық ұттыңыз! Қазір school-prize.example сілтемесіне кіріп, құпиясөзіңізді жазыңыз» деген хабарлама келді. Кемінде үш күмәнді белгі табыңдар: күтпеген сыйлық, асықтыру, белгісіз домен, құпиясөз сұрау. Сілтемені ашпай, ресми арнамен тексеру және ересек адамға хабарлау қадамдарын жазыңдар. Нақты құпиясөзді не жеке деректі енгізбеңдер.',teacher:'Қауіпсіз ойдан алынған хабарламаны береді; домен мен манипуляция белгілерін талқылатады.',student:'Хабарламаны талдайды, күмәнді белгілерді дәлелдейді, қауіпсіз әрекет жоспарын құрады.',criteria:'Фишинг белгілерін таниды. Жеке деректі қорғайтын әрекетті негіздейді.',descriptors:'Кемінде үш күмәнді белгіні атайды.\nДоменді ресми арнамен тексеруді ұсынады.\nҚұпиясөзді бөліспеу себебін түсіндіреді.\nҚауіпсіз әрекет ретін жазады.'}}
function direction(p){const t=(p.topic+' '+p.problem+' '+p.idea).toLowerCase();return /html|css|веб|web/.test(t)?'web':/кесте|excel|формула|sheet/.test(t)?'sheet':/фишинг|қауіпсіз|сілтеме|детектив/.test(t)?'safety':/python|пайтон|цикл|код/.test(t)?'python':'algorithm'}
function generate(p){const d=direction(p),t=clone(TEMPLATES[d]);if(d==='python'&&/қате|іздеуші/i.test(p.topic+' '+p.title+' '+p.problem)){t.approach='Қатені талдау және жұптық бағдарламалау';t.task='Қателі кодты талдаңдар:\nn = 3\nfor i in range(1, n + 1)\nprint(i)\nЖетіспейтін қос нүкте мен шегіністі табыңдар. Кодты түзетіп, 1, 2, 3 нәтижесін болжаңдар. Содан кейін range(1, n) нұсқасымен салыстырып, соңғы шекараның кірмейтінін түсіндіріңдер.';t.descriptors='Синтаксистік қатені табады.\nҚос нүкте мен шегіністі түзетеді.\nОрындалу нәтижесін болжайды.\nrange шекарасындағы логикалық айырманы түсіндіреді.';t.criteria='Синтаксистік қатені түзетеді. Код нәтижесін түсіндіреді.'}
const duration=Math.max(5,Number(p.duration)||45),a=Math.max(1,Math.floor(duration*.12)),b=Math.max(1,Math.floor(duration*.2)),c=Math.max(1,Math.floor(duration*.5)),e=duration-a-b-c;const offline=p.internet!=='Бар';
return {name:p.title||t.label+' зертханасы',problem:p.problem,objective:p.objective,approach:t.approach,stages:[{name:'Мәселені анықтау',minutes:a,description:p.problem+' Бастапқы түсінікті қысқа сұрақпен тексеру.'},{name:'Идеяны модельдеу',minutes:b,description:p.idea+' Мұғаліммен бірге бір мысалды талдау.'},{name:'Практикалық жұмыс',minutes:c,description:t.task},{name:'Тексеру және рефлексия',minutes:e,description:'Жұптық тексеру. «Не өзгерді? Қай қадам қиын болды?» сұрақтары бойынша қорытынды.'}],teacher:t.teacher,student:t.student,task:t.task,differentiation:'Қолдау: қадамдық нұсқаулық және жартылай толтырылған үлгі. Негізгі деңгей: тапсырманы дербес орындау. Жоғары деңгей: шартты өзгертіп, жаңа нұсқаны негіздеу. '+p.adaptation,criteria:t.criteria,descriptors:t.descriptors,resources:p.resources+'; '+(offline?'Интернетсіз: жергілікті файлдар, басылған карточкалар және қағаз модель.':'Интернет бар: онлайн материалды мұғалім алдын ала тексереді.'),expected:p.expected||'Оқушы орындау ретін түсіндіріп, жұмыс нәтижесін критериймен тексереді.',risks:'Уақыт тапшылығы: қосымша тапсырманы кейінге қалдыру. Құрылғы жетіспесе: жұппен немесе қағаз модельмен жұмыс. '+(offline?'Желі қажет ететін тапсырмаларды жергілікті баламамен алмастыру.':''),adaptation:'',source:'Үлгілерге негізделген офлайн ұсыныс',direction:d}}
function proposal(p,s){if(p.initial)p.revisions.push(clone(p.initial));p.initial=s;if(!p.edited){p.edited=clone(s);p.status=1}p.updatedAt=now()}
// Демонстрациялық жобалар: бұл нақты сабақ не зерттеу нәтижелері емес.
function demos(){const specs=[['Алгоритмді қозғалыс арқылы түсіну','6-сынып','Алгоритмдер','Оқушылар алгоритм командаларының ретін шатастырады.','Командаларды сыныптағы қозғалыспен модельдеу.',3],['Python циклдері: қайталануды рөлдік ойынмен меңгеру','8-сынып','Python циклдері','Оқушылар Python циклінің орындалу ретін түсіндіруде қиналады.','Циклді рөлдік ойын арқылы түсіндіру.',5],['Қате іздеуші','9-сынып','Python кодындағы қателер','Оқушылар синтаксистік және логикалық қатені ажырата алмайды.','Жұппен кодтағы қатені іздеп, орындауды болжау.',2],['Менің алғашқы веб-бетім','Колледж · 1-курс','HTML және CSS','Оқушылар HTML құрылымы мен CSS стилін байланыстыруда қиналады.','Шағын портфолио бетін жасап, жұптық шолу өткізу.',1],['Цифрлық детектив','7-сынып','Фишинг және күмәнді сілтемелер','Оқушылар күмәнді хабарлама белгілерін байқамайды.','Хабарламаларды қауіпсіздік белгілерімен талдау.',0]];return specs.map((s,i)=>{const p=fresh();Object.assign(p,{title:s[0],grade:s[1],topic:s[2],problem:s[3],idea:s[4],objective:i===1?'Циклдің орындалу ретін түсіндіру және Python кодын қадамдап талдау.':'Тақырып бойынша практикалық тапсырманы орындап, шешімін түсіндіру.',readiness:'Негізгі ұғымдарды біледі, практикалық қолдануда қолдау қажет.',expected:'Оқушылардың кемінде 80%-ы негізгі тапсырманы орындап, шешімін түсіндіреді.',adaptation:'Қадамдары жазылған карточка; жұмыс қарқынын баяулату; жұптық қолдау.',author:'Үлгі авторы',demo:true});if(s[5]){proposal(p,generate(p));p.edited.adaptation='Сыныпқа арналған көрнекі карточкалар және жұппен түсіндіру.';if(i===1){p.edited.stages[1].description+=' Әр айналымда оқушы i мәнін жеке карточкаға жазады.';p.edited.task+='\nМұғалім бейімдеуі: кестені алдымен қағазда толтыру, содан кейін компьютерде тексеру.'}if(s[5]>=3){p.approved=clone(p.edited);p.approvedAt=now()}p.status=s[5]}if(i===1){p.trials=[{id:uid(),grade:p.grade,date:'2026-09-18',count:24,before:52,after:78,scale:100,completed:20,observation:'Қадамдық карточкамен циклдің ретін түсіндіру жеңілдеді.',feedback:'Рөлдік ойын түсінікті болды; range шекарасы бойынша сұрақтар қалды.',difficulties:'Төрт оқушы соңғы шекараны шатастырды.',changes:'Келесі сабақта range үшін бөлек салыстыру тапсырмасын қосу.',method:'Бірдей критерийлермен бағаланған ұқсас трассалау тапсырмалары.',approvedAt:p.approvedAt,methodSnapshot:clone(p.approved)}];p.analysis='Осы демонстрациялық сыныпта орташа нәтиже 52/100-ден 78/100-ге өзгерді (+26 шкала бірлігі). 24 оқушының 20-сы тапсырманы орындады (83%). range шекарасын түсіндіру қиындығы қалды. Келесі сынақта шекараға арналған салыстыру тапсырмасы қосылады. Бір сабақ нәтижесі әдістеменің жалпы тиімділігін дәлелдемейді.';p.analysisApprovedAt=now()}return p})}
try{const raw=localStorage.getItem(KEY);if(raw){data=JSON.parse(raw);if(!validEnvelope(data))throw Error('Құрылымы сәйкес емес')}else data={version:VERSION,projects:demos()}}catch(e){storageOK=false;data={version:VERSION,projects:demos()};setTimeout(()=>toast('Браузердегі деректерді оқу мүмкін болмады. JSON экспортын пайдаланыңыз.'),300)}
function current(){return data.projects.find(p=>p.id===selected)}
function save(p){if(p)p.updatedAt=now();try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;document.getElementById('save-state').textContent='Сақталды'}catch(e){storageOK=false;document.getElementById('save-state').textContent='Сақталмады · JSON экспорттаңыз';toast('Браузер деректерді сақтай алмады. Жұмысыңызды JSON файлына экспорттаңыз.')}}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),4500)}
function badge(p){return `<span class="badge s${p.status}">${STATUSES[p.status]}</span>${p.demo?'<span class="badge demo">Демонстрациялық деректер</span>':''}`}
function header(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">ӘДІСТЕМЕLAB / ИНФОРМАТИКА</div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function notice(){return '<div class="notice">✳ &nbsp; ЖИ ұсынысы — бастапқы нұсқа. Соңғы педагогикалық шешімді мұғалім қабылдайды.</div>'}
function navigate(v,id){view=v;if(id)selected=id;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${view===n[0]?'active':''}" data-nav="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join('');document.getElementById('crumb').textContent=NAV.find(n=>n[0]===view)?.[2]||'';document.getElementById('content').innerHTML=({home:home,idea:idea,assistant:assistant,editor:editor,trial:trial,results:results,library:library}[view])();document.getElementById('save-state').textContent=storageOK?'Сақталды':'Сақталмады · JSON экспорттаңыз'}
function card(p){const t=p.trials.at(-1);return `<article class="card"><div class="meta"><span>${esc(p.grade)}</span><span>·</span><span>${esc(p.topic)}</span></div><h3>${esc(p.title||'Атаусыз жоба')}</h3><p>${esc(p.problem||'Оқу мәселесін сипаттаңыз')}</p><div class="meta">${badge(p)}</div><div class="author">${esc(p.author)} · ${date(p.updatedAt)}</div>${t?`<p>Сыныптағы сынақ: ${t.before} → ${t.after} / ${t.scale} · ${t.completed}/${t.count} орындады</p>`:''}<div class="card-foot"><button class="text-btn" data-open="${p.id}">Жобаны ашу</button><div class="actions"><button class="text-btn" data-copy="${p.id}" aria-label="Көшірмесін жасау">Көшірме</button><button class="text-btn" data-delete="${p.id}" aria-label="Жобаны өшіру">Өшіру</button></div></div></article>`}

Бұл — осы сыныптағы бір сынақтың нәтижесі. Өзгеріске басқа факторлар да әсер етуі мүмкін. Әдістеменің жалпы тиімділігі дәлелденді деп қорытынды жасауға жеткіліксіз.`}
function statusChart(){return STATUSES.map((s,i)=>{const n=data.projects.filter(p=>p.status===i).length;return `<div class="status-line"><span>${s}</span><strong>${n}</strong></div><div class="progress"><i style="width:${data.projects.length?n/data.projects.length*100:0}%"></i></div>`}).join('')}
function results(){const pick=picker(),p=current();const t=p?.trials.at(-1);return header('Нәтиже және жетілдіру','Сыныптағы өзгерісті байқаңыз. Келесі қадамды өзіңіз таңдаңыз.')+pick+(p?steps(p):'')+`<div class="grid"><section class="panel"><h2>Сынаққа дейін / кейін</h2>${t?`${p.demo?'<span class="badge demo">Демонстрациялық деректер</span>':''}<div class="chart"><div class="bar-wrap"><strong>${t.before}</strong><div class="bar" style="height:${t.before/t.scale*130}px"></div></div><div class="bar-wrap"><strong>${t.after}</strong><div class="bar after" style="height:${t.after/t.scale*130}px"></div></div></div><div class="chart-labels"><span>Сынаққа дейін</span><span>Сынақтан кейін</span></div><p class="help">Шкала: 0–${t.scale} · ${esc(t.grade)} · ${date(t.date)}<br>Соңғы тіркелген сынақ көрсетілген.</p>`:'<div class="empty">Салыстыру үшін сынақ деректері қажет.</div>'}</section><section class="panel"><h2>Тапсырманы орындағандар</h2>${t?`<div class="ring" style="--percent:${t.completed/t.count*100}%"><div>${Math.round(t.completed/t.count*100)}%</div></div><p style="text-align:center" class="muted">${t.count} оқушының ${t.completed}-і орындады</p>`:'<div class="empty">Орындау нәтижелері әлі жоқ.</div>'}</section></div><section class="panel"><h2>Жобалар мәртебесі</h2>${statusChart()}</section>`+(t?`<section class="panel edited"><div class="section-head"><h2>Мұғалім қорытындысы</h2>${p.analysisApprovedAt?'<span class="badge s3">Қорытынды бекітілді</span>':'<span class="badge s2">Бастапқы талдау</span>'}</div><p class="help">Талдау сандық деректер мен бақылаудан құрастырылады. Қорытындыны мұғалім өңдеп, өзі бекітеді.</p><textarea id="analysis-text" rows="12">${esc(p.analysis||analysisText(t))}</textarea><div class="actions" style="margin-top:17px"><button class="btn secondary" data-analyze>Бастапқы талдау құрастыру</button><button class="btn" data-approve-analysis>Қорытындыны бекіту</button><button class="btn soft" data-improve>Әдістемені жетілдіру</button><button class="btn secondary" data-print>Басып шығару / PDF</button></div><p class="help">Бір сабақ нәтижесі әдістеменің жалпы тиімділігін дәлелдемейді.</p></section>`:'<button class="btn" data-nav="trial">Сынақ картасын толтыру</button>')}
function library(){const grades=[...new Set(data.projects.map(p=>p.grade))].filter(Boolean),approaches=[...new Set(data.projects.map(p=>p.edited?.approach).filter(Boolean))];return header('Әдістемелер қоры','Идеяларыңыз, өңделген әдістемелеріңіз және сынақтарыңыз.',`<div class="actions"><button class="btn secondary" data-import>JSON импорт</button><button class="btn secondary" data-export>JSON экспорт</button><button class="btn" data-new>＋ Жаңа жоба</button></div>`)+`<div class="filter"><input id="filter-q" aria-label="Тақырып бойынша іздеу" placeholder="Тақырып немесе жоба атауы…" value="${esc(filters.q)}"><select id="filter-grade" aria-label="Сынып бойынша сүзгі"><option value="">Барлық сыныптар</option>${grades.map(s=>`<option ${s===filters.grade?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="filter-status" aria-label="Мәртебе бойынша сүзгі"><option value="">Барлық мәртебелер</option>${STATUSES.map((s,i)=>`<option value="${i}" ${String(i)===filters.status?'selected':''}>${s}</option>`).join('')}</select><select id="filter-approach" aria-label="Педагогикалық тәсіл бойынша сүзгі"><option value="">Барлық тәсілдер</option>${approaches.map(s=>`<option ${s===filters.approach?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="grid" id="cards">${filteredCards()}</div><footer>Экспорт жеке резервтік көшірме жасайды. Импорт жобаларды қосады, бар деректерді алмастырмайды.</footer>`}
function filteredCards(){const ps=data.projects.filter(p=>(p.title+' '+p.topic).toLowerCase().includes(filters.q.toLowerCase())&&(!filters.grade||p.grade===filters.grade)&&(filters.status===''||String(p.status)===filters.status)&&(!filters.approach||p.edited?.approach===filters.approach));return ps.map(card).join('')||'<div class="empty">Бұл сүзгіге сәйкес жоба табылмады.</div>'}
function validMethod(s){return s&&typeof s==='object'&&SECTIONS.every(([k])=>typeof s[k]==='string'&&s[k].length<=100000)&&Array.isArray(s.stages)&&s.stages.length<=100&&s.stages.every(t=>t&&typeof t.name==='string'&&typeof t.description==='string'&&Number.isFinite(t.minutes)&&t.minutes>=0&&t.minutes<=240)&&typeof s.source==='string'}
// Импорт: құрылымды тексеру, жеке id тағайындау және бар жобаларды сақтап қосу.
function validEnvelope(d){return d&&d.version===VERSION&&Array.isArray(d.projects)&&d.projects.length<=1000&&d.projects.every(p=>p&&typeof p.id==='string'&&(!p.trialDraft||TRIALFIELDS.every(([k])=>typeof p.trialDraft[k]==='string'||(typeof p.trialDraft[k]==='number'&&Number.isFinite(p.trialDraft[k]))))&&BASE.every(([k])=>k==='duration'?(p[k]===''||(Number.isFinite(Number(p[k]))&&p[k]>=0&&p[k]<=100000)):typeof p[k]==='string'&&p[k].length<=100000)&&Number.isInteger(p.status)&&p.status>=0&&p.status<=5&&typeof p.demo==='boolean'&&Array.isArray(p.trials)&&p.trials.every(t=>!trialError(t)&&validMethod(t.methodSnapshot)&&typeof t.approvedAt==='string')&&[p.initial,p.edited,p.approved].every(s=>s===null||validMethod(s))&&typeof p.analysis==='string'&&typeof p.external==='string'&&typeof p.prompt==='string'&&Array.isArray(p.revisions)&&p.revisions.every(validMethod)&&typeof p.createdAt==='string'&&typeof p.updatedAt==='string'&&(!p.approvedAt||(p.approved&&p.edited&&JSON.stringify(p.approved)===JSON.stringify(p.edited)))&&(p.status<3||Boolean(p.approvedAt&&p.approved))&&(p.status<4||p.trials.length>0)&&(p.status<5||Boolean(p.analysisApprovedAt)))}
function download(ps){const blob=new Blob([JSON.stringify({version:VERSION,exportedAt:now(),projects:ps},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AdistemeLab-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('JSON файлы экспортталды.')}
async function clipboard(text){try{await navigator.clipboard.writeText(text);toast('Промпт көшірілді.')}catch{const ta=document.getElementById('prompt-text');ta.focus();ta.select();toast('Көшіру үшін Ctrl+C басыңыз.')}}
function printProject(p){const s=p.approved||p.edited||p.initial;document.getElementById('print-area').innerHTML=`<h1>ӘдістемеLab</h1><h2>${esc(p.title)}</h2><p>${esc(p.grade)} · Информатика · ${esc(p.author)}</p><p>${STATUSES[p.status]}${p.demo?' · Демонстрациялық деректер':''}</p><p>${p.approvedAt?'Мұғалім бекіткен: '+date(p.approvedAt):'Бастапқы / өңделіп жатқан нұсқа. Мұғалім бекітпеген.'}</p>${s?snapshot(s):BASE.map(([k,l])=>`<h3>${l}</h3><p>${esc(p[k])}</p>`).join('')}${p.trials.map(t=>`<h2>Сыныптағы сынақ · ${date(t.date)}</h2><p>${esc(t.grade)} · ${t.count} оқушы<br>Нәтиже: ${t.before} → ${t.after} / ${t.scale}<br>Орындағандар: ${t.completed}/${t.count}</p><p>Бақылау: ${esc(t.observation)}<br>Кері байланыс: ${esc(t.feedback)}<br>Қиындық: ${esc(t.difficulties)}<br>Келесі өзгеріс: ${esc(t.changes)}</p>`).join('')}${p.analysis?`<h2>Мұғалім қорытындысы</h2><p>${esc(p.analysis)}</p><p>${p.analysisApprovedAt?'Бекітілді: '+date(p.analysisApprovedAt):'Қорытынды бекітілмеген'}</p>`:''}<footer>Бұл сыныптағы сынақ нәтижесі әдістеменің жалпы тиімділігін дәлелдемейді.</footer>`;window.print()}
function addNew(){const p=fresh();data.projects.unshift(p);selected=p.id;save(p);navigate('idea')}
document.addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;const p=current();if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.hasAttribute('data-new')){addNew();return}if(b.dataset.open){selected=b.dataset.open;editorTab='edited';navigate('idea');return}if(b.dataset.copy){const orig=data.projects.find(x=>x.id===b.dataset.copy),c=clone(orig);Object.assign(c,{id:uid(),title:orig.title+' — көшірме',demo:false,status:c.edited?2:0,author:'Мұғалім',approved:null,approvedAt:null,trials:[],analysis:'',analysisApprovedAt:null,createdAt:now(),updatedAt:now()});data.projects.unshift(c);selected=c.id;save(c);navigate('idea');toast('Көшірме жасалды. Сынақ нәтижелері жаңа жобаға көшірілмеді.');return}if(b.dataset.delete){const x=data.projects.find(p=>p.id===b.dataset.delete);if(confirm('«'+x.title+'» жобасын және оның деректерін өшіруді растайсыз ба?')){data.projects=data.projects.filter(p=>p.id!==x.id);if(selected===x.id)selected=null;save();render();toast('Жоба өшірілді.')}return}if(b.hasAttribute('data-export')){download(data.projects);return}if(b.hasAttribute('data-import')){document.getElementById('import-file').click();return}if(!p)return;
if(b.hasAttribute('data-save-idea')){if(validateIdea(p)){save(p);toast('Жоба сақталды.')}}
if(b.hasAttribute('data-generate')){if(!validateIdea(p))return;proposal(p,generate(p));save(p);editorTab='initial';navigate('editor');toast(p.revisions.length?'Жаңа бастапқы ұсыныс сақталды. Мұғалім түзетулері өзгерген жоқ.':'Бастапқы ұсыныс дайын. Мұғалім өңдеуі мен бекітуі қажет.')}
if(b.hasAttribute('data-prompt')){if(!validateIdea(p))return;p.prompt=promptFor(p);save(p);mode='external';navigate('assistant')}
if(b.dataset.mode){mode=b.dataset.mode;render()}
if(b.hasAttribute('data-refresh-prompt')){if(validateIdea(p)){p.prompt=promptFor(p);save(p);render();toast('Промпт жаңартылды.')}}
if(b.hasAttribute('data-copy-prompt'))await clipboard(document.getElementById('prompt-text').value);
if(b.hasAttribute('data-import-response')){if(!validateIdea(p))return;if(!p.external.trim()){toast('Алдымен сыртқы ЖИ жауабын енгізіңіз.');return}const s=generate(p);for(const[k]of SECTIONS)s[k]='';Object.assign(s,{name:p.title,problem:p.problem,objective:p.objective,task:p.external,stages:[],source:'Сыртқы ЖИ жауабы — бастапқы нұсқа',direction:direction(p)});proposal(p,s);save(p);editorTab='initial';navigate('editor');toast('Жауап сақталды. Редакторда бөлімдерге бөліп, толықтырыңыз.')}
if(b.dataset.tab){editorTab=b.dataset.tab;render()}
if(b.hasAttribute('data-use-initial')){if(p.edited&&!confirm('Өңделген нұсқаны соңғы бастапқы ұсыныспен ауыстырасыз ба? Бұрынғы түзетулер жеке тарихта сақталады.'))return;if(p.edited)p.revisions.push({...clone(p.edited),source:'Мұғалімнің бұрын өңдеген нұсқасы'});p.edited=clone(p.initial);invalidate(p);editorTab='edited';render()}
if(b.hasAttribute('data-add-stage')){p.edited.stages.push({name:'Жаңа кезең',minutes:5,description:''});invalidate(p);render()}
if(b.hasAttribute('data-remove-stage')){p.edited.stages.splice(Number(b.dataset.removeStage),1);invalidate(p);render()}
if(b.hasAttribute('data-save-editor')){save(p);toast('Мұғалім түзетулері сақталды.')}
if(b.hasAttribute('data-reject')){if(confirm('Ұсынысты қабылдамай тастайсыз ба? Өңделген нұсқа тарихта сақталады.')){if(p.edited)p.revisions.push({...clone(p.edited),source:'Мұғалім қабылдамаған нұсқа'});p.edited=null;p.approved=null;p.approvedAt=null;p.analysisApprovedAt=null;p.status=0;save(p);render();toast('Ұсыныс қабылданбады. Бастапқы нұсқа сақталған.')}}
if(b.hasAttribute('data-approve')){const s=p.edited,total=s.stages.reduce((a,x)=>a+Number(x.minutes),0);if(SECTIONS.filter(([k])=>k!=='adaptation').some(([k])=>!s[k].trim())||!s.adaptation.trim()||!s.stages.length||s.stages.some(x=>!x.name.trim()||!x.description.trim()||!Number.isFinite(x.minutes)||x.minutes<=0)){toast('Барлық бөлімді, сыныпқа бейімдеу түсіндірмесін және кезеңдерді толықтырыңыз.');return}if(total!==Number(p.duration)){toast('Кезеңдер уақыты сабақ ұзақтығына тең болуы керек: '+p.duration+' минут.');return}p.approved=clone(s);p.approvedAt=now();p.status=3;p.analysisApprovedAt=null;save(p);render();toast('Мұғалім бекітті. Әдістеме сынаққа дайын.')}
if(b.hasAttribute('data-save-trial')){if(!p.approvedAt||!p.approved){toast('Әдістемені алдымен бекітіңіз.');return}const t=clone(p.trialDraft),error=trialError(t);if(error){toast(error);return}for(const k of ['count','scale','before','after','completed'])t[k]=Number(t[k]);Object.assign(t,{id:uid(),approvedAt:p.approvedAt,methodSnapshot:clone(p.approved)});p.trials.push(t);p.status=4;p.analysis=analysisText(t);p.analysisApprovedAt=null;delete p.trialDraft;save(p);navigate('results');toast('Сынақ тіркелді. Бастапқы талдауды тексеріңіз.')}
if(b.hasAttribute('data-analyze')){const t=p.trials.at(-1);if(!t)return;if(p.analysis&&!confirm('Өңделген қорытындыны бастапқы талдаумен ауыстырасыз ба?'))return;p.analysis=analysisText(t);p.analysisApprovedAt=null;if(p.approvedAt)p.status=4;save(p);render()}
if(b.hasAttribute('data-approve-analysis')){if(!p.trials.length||!p.analysis.trim()){toast('Сынақ деректері мен қорытынды қажет.');return}if(!p.approvedAt){toast('Өзгертілген әдістемені қайта бекітіңіз.');return}p.analysisApprovedAt=now();p.status=5;save(p);render();toast('Мұғалім қорытындысы бекітілді.')}
if(b.hasAttribute('data-improve')){if(!p.trials.length)return;if(!confirm('Әдістемені келесі сынаққа жетілдіруді бастайсыз ба? Жаңа түзетулер қайта бекітіледі.'))return;p.edited.adaptation+='\nКелесі сынаққа өзгеріс: '+p.trials.at(-1).changes;invalidate(p);editorTab='edited';navigate('editor')}
if(b.hasAttribute('data-export-one'))download([p]);if(b.hasAttribute('data-print'))printProject(p);
});
document.addEventListener('input',ev=>{const el=ev.target,p=current();if(el.id.startsWith('filter-')){filters[el.id.slice(7)]=el.value;document.getElementById('cards').innerHTML=filteredCards();return}if(!p)return;if(el.closest('#idea-form')){const k=el.id.slice(2);p[k]=k==='duration'?(el.value===''?'':Number(el.value)):el.value;if(p.edited){p.approved=null;p.approvedAt=null;p.analysisApprovedAt=null;p.status=p.edited?2:0}save(p)}if(el.closest('#editor-form')){p.edited[el.id.slice(7)]=el.value;invalidate(p)}if(el.dataset.stage!==undefined){const s=p.edited.stages[Number(el.dataset.stage)];s[el.dataset.key]=el.dataset.key==='minutes'?Number(el.value):el.value;invalidate(p);document.getElementById('total-time').textContent='Жалпы уақыт: '+p.edited.stages.reduce((a,s)=>a+Number(s.minutes),0)+' / '+p.duration+' минут'}if(el.closest('#trial-form')){p.trialDraft[el.id.slice(8)]=el.value;save(p)}if(el.id==='external-text'){p.external=el.value;save(p)}if(el.id==='analysis-text'){p.analysis=el.value;p.analysisApprovedAt=null;if(p.approvedAt&&p.trials.length)p.status=4;save(p)}});
document.addEventListener('change',ev=>{if(ev.target.id==='project-pick'){selected=ev.target.value;render()}if(ev.target.id.startsWith('filter-')){filters[ev.target.id.slice(7)]=ev.target.value;document.getElementById('cards').innerHTML=filteredCards()}});
document.getElementById('import-file').addEventListener('change',async ev=>{const file=ev.target.files[0];ev.target.value='';if(!file)return;if(file.size>10*1024*1024){toast('JSON файлы 10 МБ-тан аспауы керек.');return}try{const d=JSON.parse(await file.text());if(!validEnvelope(d))throw Error('Құрылымы немесе деректері жарамсыз. ӘдістемеLab JSON экспортын таңдаңыз.');if(!d.projects.length){toast('Файлда жобалар жоқ.');return}if(!confirm(d.projects.length+' жоба қосылады. Бар жобалар сақталады. Жалғастырасыз ба?'))return;const ps=d.projects.map(x=>{const p=clone(x);p.id=uid();p.title+=' — импорт';p.updatedAt=now();return p});data.projects.push(...ps);save();navigate('library');toast(ps.length+' жоба қосылды. Бар деректер алмастырылған жоқ.')}catch(e){toast('Импорт орындалмады: '+e.message)}});
window.addEventListener('storage',ev=>{if(ev.key===KEY)toast('Басқа терезеде деректер өзгерді. Соңғы өзгерістерді алу үшін бетті жаңартыңыз.')});
if(storageOK)save();render();
</script></body></html>
